name: Platform checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/global-readiness-20261027']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:quality
      - run: npm run test:rules
      - name: Production dependency security audit
        id: production_audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Enforce production security gate
        if: steps.production_audit.outcome == 'failure'
        run: |
          echo 'Production dependency vulnerabilities remain unresolved. Release blocked.' >&2
          exit 1

  prepare-security-dependencies:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/global-readiness-20261027' && github.repository == 'Thom-Code-Cell/Motivationsboost'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/global-readiness-20261027
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare safe patch versions and migrate schema imports
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=15.5.28 dependencies.zod=4.6.7 'dependencies.@hookform/resolvers=5.9.1'
          python3 - <<'PY'
          from pathlib import Path
          for folder in ('src', 'tests'):
              for path in Path(folder).rglob('*'):
                  if path.suffix not in ('.ts', '.tsx', '.js', '.mjs', '.cjs'): continue
                  original = path.read_text(encoding='utf-8')
                  modified = original.replace("from 'zod'", "from 'zod/v3'").replace('from "zod"', 'from "zod/v3"')
                  modified = modified.replace("require('zod')", "require('zod/v3')").replace('require("zod")', 'require("zod/v3")')
                  if modified != original: path.write_text(modified, encoding='utf-8')
          PY
          npm install --no-audit --no-fund
          npm audit fix --omit=dev --no-fund || true
          npm ci --no-audit --no-fund
      - name: Full security and compatibility checks
        run: |
          npm run typecheck
          npm test
          npm run test:quality
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Commit reviewed dependency patch on development branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src tests
          if ! git diff --cached --quiet; then
            git commit -m 'Security: apply compatible audited npm patches'
            git push origin HEAD:feat/global-readiness-20261027
          fi
