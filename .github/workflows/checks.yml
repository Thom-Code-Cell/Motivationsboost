name: Platform checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:quality
      - run: npm run test:rules
      - name: Production dependency security audit
        id: production_audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Enforce production security gate
        if: steps.production_audit.outcome == 'failure'
        run: |
          echo 'Production dependency vulnerabilities remain unresolved. Release blocked.' >&2
          exit 1
