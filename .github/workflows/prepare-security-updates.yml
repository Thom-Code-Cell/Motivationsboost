name: Prepare reviewed security dependency updates
on:
  push:
    branches: ['feat/global-readiness-20261027']
    paths: ['.github/workflows/prepare-security-updates.yml']
permissions:
  contents: write

jobs:
  dependency-preparation:
    if: github.repository == 'Thom-Code-Cell/Motivationsboost' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/global-readiness-20261027
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Pin known patched direct dependencies
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=15.5.28 dependencies.zod=4.6.7 'dependencies.@hookform/resolvers=5.9.1'
          # Preserve the application's existing v3 schema API during a compatibility migration.
          python3 - <<'PY'
          from pathlib import Path
          for folder in ('src', 'tests'):
              for path in Path(folder).rglob('*'):
                  if path.suffix not in ('.ts', '.tsx', '.js', '.mjs', '.cjs'): continue
                  original = path.read_text(encoding='utf-8')
                  updated = original.replace("from 'zod'", "from 'zod/v3'").replace('from "zod"', 'from "zod/v3"')
                  updated = updated.replace("require('zod')", "require('zod/v3')").replace('require("zod")', 'require("zod/v3")')
                  if updated != original: path.write_text(updated, encoding='utf-8')
          PY
      - name: Regenerate real npm lockfile and update compatible transitive dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm audit fix --omit=dev --no-fund || true
          npm ci --no-audit --no-fund
          npm ls next zod sharp dompurify undici || true
      - name: Build and unit gate before updating branch
        run: |
          npm run typecheck
          npm test
          npm run test:quality
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Commit only fully checked source and lockfile to the development branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src tests
          if ! git diff --cached --quiet; then
            git commit -m "Security: patch Next, Zod and transitive npm vulnerabilities after validation"
            git push origin HEAD:feat/global-readiness-20261027
          fi
